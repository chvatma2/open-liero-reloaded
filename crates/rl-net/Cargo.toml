[package]
name = "rl-net"
description = "Real transport for online play: WebRTC data channels over str0m, signalling, LAN announcements."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[dependencies]
str0m.workspace = true
rl-netcode.workspace = true
rl-proto.workspace = true
tungstenite.workspace = true
getrandom.workspace = true
turn-client-proto.workspace = true
hmac.workspace = true
sha1.workspace = true
md-5.workspace = true
crc32fast.workspace = true

[features]
# Test-only API (EndpointConfig's overrides, the virtual NAT network
# `natsim`): enabled by this crate's own tests and other crates'
# dev-dependencies, never by a build that ships.
test-hooks = []

[dev-dependencies]
proptest.workspace = true
rl-net = { workspace = true, features = ["test-hooks"] }

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "link"

[lints]
workspace = true
