[package]
name = "olr-server"
description = "The headless dedicated server: a lobby without a local player, a map rotation, fill bots, admins' chat commands, bans and a log."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "olr-server"
path = "src/main.rs"

[dependencies]
olr-online.workspace = true
olr-lobby.workspace = true
olr-net.workspace = true
olr-discovery.workspace = true
olr-proto.workspace = true
olr-content.workspace = true
olr-bots.workspace = true
olr-modes.workspace = true
olr-sim.workspace = true
anyhow.workspace = true
clap.workspace = true
ctrlc.workspace = true
serde = { workspace = true, features = ["std"] }
ron.workspace = true

[features]
# Tests only: `Config::test_gateway` (a `FakeGateway` and a pinned base
# address) and `nat_check::run_with`; olr-net's port mapper then refuses
# real routers. Enabled by this crate's own dev-dependency.
test-hooks = ["olr-net/test-hooks"]

[dev-dependencies]
tempfile.workspace = true
# The announcement tests run a relay and a STUN server in-process.
olr-discovery = { workspace = true, features = ["test-relay"] }
# olr-net's test hooks: its port mapper refuses real routers in tests.
olr-net = { workspace = true, features = ["test-hooks"] }
# This crate's own test hooks (olr-discovery's pattern).
olr-server = { path = ".", features = ["test-hooks"] }

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
