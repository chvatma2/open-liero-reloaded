[package]
name = "rl-server"
description = "The headless dedicated server: a lobby without a local player, a map rotation, fill bots, admins' chat commands, bans and a log."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "rl-server"
path = "src/main.rs"

[dependencies]
rl-online.workspace = true
rl-lobby.workspace = true
rl-net.workspace = true
rl-proto.workspace = true
rl-content.workspace = true
rl-bots.workspace = true
rl-modes.workspace = true
rl-sim.workspace = true
anyhow.workspace = true
clap.workspace = true
ctrlc.workspace = true
serde = { workspace = true, features = ["std"] }
ron.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
