[package]
name = "rl-server"
description = "The headless dedicated server: a lobby without a local player, a map rotation, fill bots, admins' chat commands, bans and a log."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "rl-server"
path = "src/main.rs"

[dependencies]
rl-online.workspace = true
rl-lobby.workspace = true
rl-net.workspace = true
rl-discovery.workspace = true
rl-proto.workspace = true
rl-content.workspace = true
rl-bots.workspace = true
rl-modes.workspace = true
rl-sim.workspace = true
anyhow.workspace = true
clap.workspace = true
ctrlc.workspace = true
serde = { workspace = true, features = ["std"] }
ron.workspace = true

[features]
# Tests only: `Config::test_gateway` (a `FakeGateway` and a pinned base
# address) and `nat_check::run_with`; rl-net's port mapper then refuses
# real routers. Enabled by this crate's own dev-dependency.
test-hooks = ["rl-net/test-hooks"]

[dev-dependencies]
tempfile.workspace = true
# The announcement tests run a relay and a STUN server in-process.
rl-discovery = { workspace = true, features = ["test-relay"] }
# rl-net's test hooks: its port mapper refuses real routers in tests.
rl-net = { workspace = true, features = ["test-hooks"] }
# This crate's own test hooks (rl-discovery's pattern).
rl-server = { path = ".", features = ["test-hooks"] }

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
