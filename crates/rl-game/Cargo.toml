[package]
name = "rl-game"
description = "The game binary: a winit window, the 100 Hz fixed-tick loop over the simulation with interpolated wgpu rendering, cosmetic entities, sound, input and an egui overlay; for now the M5 sandbox."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[[bin]]
name = "rl-game"
path = "src/main.rs"

[dependencies]
rl-math.workspace = true
rl-data.workspace = true
rl-terrain.workspace = true
rl-pack.workspace = true
rl-sim.workspace = true
rl-content.workspace = true
rl-modes.workspace = true
rl-bots.workspace = true
rl-replay.workspace = true
rl-scene.workspace = true
rl-fx.workspace = true
rl-render.workspace = true
rl-present.workspace = true
rl-audio.workspace = true
rl-input.workspace = true
rl-ui.workspace = true
rl-proto.workspace = true
rl-netcode.workspace = true
rl-online.workspace = true
rl-lobby.workspace = true
rl-net.workspace = true
rl-discovery.workspace = true
anyhow.workspace = true
clap.workspace = true
serde = { workspace = true, features = ["std"] }
ron.workspace = true
serde_json.workspace = true
wgpu.workspace = true
pollster.workspace = true
winit.workspace = true
gilrs.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true

[features]
# Tests only: `Shell::test_ice` (every endpoint's ICE settings, a
# `FakeGateway` and a loopback base, ruling NT-1). Forwards rl-online's, so
# rl-net's port mapper refuses real routers. Enabled by this crate's own
# dev-dependency, never by a build that ships.
test-hooks = ["rl-online/test-hooks"]

[dev-dependencies]
tempfile.workspace = true
rl-vfs.workspace = true
rl-game = { path = ".", features = ["test-hooks"] }
# The tests set a client's prompt bytes (`OnlinePeer::test_prompt_limit`).
rl-online = { workspace = true, features = ["test-hooks"] }
# Finding games end to end (plan 12a): the dedicated server in-process,
# announcing to rl-discovery's in-process test relay; its `test_gateway`
# pins a loopback base (plan 12b).
rl-discovery = { workspace = true, features = ["test-relay"] }
rl-server = { workspace = true, features = ["test-hooks"] }

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "soak"

[lints]
workspace = true
