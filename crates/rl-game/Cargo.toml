[package]
name = "rl-game"
description = "The game binary: a winit window, the 100 Hz fixed-tick loop over the simulation with interpolated wgpu rendering, cosmetic entities, sound, input and an egui overlay; for now the M5 sandbox."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[[bin]]
name = "rl-game"
path = "src/main.rs"

[dependencies]
rl-math.workspace = true
rl-data.workspace = true
rl-terrain.workspace = true
rl-pack.workspace = true
rl-sim.workspace = true
rl-content.workspace = true
rl-modes.workspace = true
rl-bots.workspace = true
rl-replay.workspace = true
rl-scene.workspace = true
rl-fx.workspace = true
rl-render.workspace = true
rl-present.workspace = true
rl-audio.workspace = true
rl-input.workspace = true
rl-ui.workspace = true
rl-proto.workspace = true
rl-netcode.workspace = true
rl-online.workspace = true
anyhow.workspace = true
clap.workspace = true
serde = { workspace = true, features = ["std"] }
ron.workspace = true
serde_json.workspace = true
wgpu.workspace = true
pollster.workspace = true
winit.workspace = true
gilrs.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true

[dev-dependencies]
tempfile.workspace = true
rl-lobby.workspace = true
rl-net.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "soak"

[lints]
workspace = true
