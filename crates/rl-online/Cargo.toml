[package]
name = "rl-online"
description = "Online play over real connections: the lobby, the match and its replay, from the first handshake back to the lobby."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[dependencies]
rl-net.workspace = true
rl-netcode.workspace = true
rl-proto.workspace = true
rl-lobby.workspace = true
rl-content.workspace = true
rl-sim.workspace = true
rl-bots.workspace = true
rl-modes.workspace = true
rl-replay.workspace = true
rl-terrain.workspace = true
anyhow.workspace = true
serde = { workspace = true, features = ["std"] }
postcard.workspace = true

[features]
# Test-only API (OnlinePeer::test_seed_override): enabled by this crate's
# own tests, never by a build that ships.
test-hooks = []

[dev-dependencies]
proptest.workspace = true
rl-online = { workspace = true, features = ["test-hooks"] }

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
