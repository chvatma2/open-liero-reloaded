[package]
name = "rl-online"
description = "Online play over real connections: the lobby, the match and its replay, from the first handshake back to the lobby."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[dependencies]
rl-net.workspace = true
# The joiner's and the host's Nostr handshakes (N45, N54; same-layer pair
# N55): the relay pool, `Inbox`/`Asker`, TURN notes.
rl-discovery.workspace = true
rl-netcode.workspace = true
rl-proto.workspace = true
rl-lobby.workspace = true
rl-content.workspace = true
rl-pack.workspace = true
rl-data.workspace = true
rl-vfs.workspace = true
rl-sim.workspace = true
rl-bots.workspace = true
rl-modes.workspace = true
rl-replay.workspace = true
rl-terrain.workspace = true
anyhow.workspace = true
serde = { workspace = true, features = ["std"] }
postcard.workspace = true
sha2.workspace = true
hex.workspace = true

[features]
# Test-only API (OnlinePeer::test_seed_override): enabled by this crate's
# own tests, never by a build that ships. Forwards rl-net's, so a per-crate
# test run keeps rl-net's port-mapping guard on (tests never map a real
# router).
test-hooks = ["rl-net/test-hooks"]

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
rl-online = { workspace = true, features = ["test-hooks"] }
# `TestRelay` for the joins through Nostr (`tests/through.rs`).
rl-discovery = { workspace = true, features = ["test-relay"] }
# `IceConfig::{base_override, relay_only, gateway, ssdp}` and `FakeGateway`.
rl-net = { workspace = true, features = ["test-hooks"] }

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
