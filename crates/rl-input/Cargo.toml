[package]
name = "rl-input"
description = "Keyboard (winit physical keys) and gamepad (gilrs) input mapped to the simulation's 8 keys, with rebindable bindings and presses and releases latched between 100 Hz ticks."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[dependencies]
rl-sim.workspace = true
serde = { workspace = true, features = ["std"] }
winit.workspace = true
gilrs.workspace = true

[dev-dependencies]
ron.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
