[package]
name = "rl-cli"
description = "Headless command-line tool: import OLX content, validate packs, replay and render oracle scenarios, play headless bot matches and replays."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "rl-cli"
path = "src/main.rs"

[dependencies]
rl-data.workspace = true
rl-vfs.workspace = true
rl-pack.workspace = true
rl-oracle.workspace = true
rl-scenario.workspace = true
rl-content.workspace = true
rl-terrain.workspace = true
rl-scene.workspace = true
rl-fx.workspace = true
rl-render.workspace = true
rl-present.workspace = true
rl-sim.workspace = true
rl-modes.workspace = true
rl-bots.workspace = true
rl-replay.workspace = true
rl-netcode.workspace = true
rl-proto.workspace = true
rl-online.workspace = true
rl-net.workspace = true
rl-lobby.workspace = true
rl-server.workspace = true
rl-discovery.workspace = true
serde_json.workspace = true
postcard.workspace = true
wgpu.workspace = true
anyhow.workspace = true
clap.workspace = true
serde = { workspace = true, features = ["std"] }
ron.workspace = true
tempfile.workspace = true

[dev-dependencies]
proptest.workspace = true
allocation-counter.workspace = true
insta.workspace = true
divan.workspace = true
# The relay probe's tests run against the in-process test relay.
rl-discovery = { workspace = true, features = ["test-relay"] }
# rl-net's test hooks: its port mapper refuses real routers in tests.
rl-net = { workspace = true, features = ["test-hooks"] }

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "golden"

[[test]]
name = "gpu_bench"

[[test]]
name = "grid"

[[test]]
name = "net_cases"

[[test]]
name = "net_sim"

[[test]]
name = "render_golden"

[[test]]
name = "transport"

[[bench]]
name = "game"
harness = false

[[bench]]
name = "rollback"
harness = false

[lints]
workspace = true
