[package]
name = "rl-cli"
description = "Headless command-line tool: import OLX content, validate packs, replay and render oracle scenarios, play headless bot matches and replays."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "rl-cli"
path = "src/main.rs"

[dependencies]
rl-data.workspace = true
rl-vfs.workspace = true
rl-pack.workspace = true
rl-oracle.workspace = true
rl-scenario.workspace = true
rl-content.workspace = true
rl-terrain.workspace = true
rl-scene.workspace = true
rl-fx.workspace = true
rl-render.workspace = true
rl-present.workspace = true
rl-sim.workspace = true
rl-modes.workspace = true
rl-bots.workspace = true
rl-replay.workspace = true
rl-netcode.workspace = true
rl-proto.workspace = true
serde_json.workspace = true
postcard.workspace = true
wgpu.workspace = true
anyhow.workspace = true
clap.workspace = true
serde = { workspace = true, features = ["std"] }
ron.workspace = true

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
allocation-counter.workspace = true
insta.workspace = true
divan.workspace = true

[[bench]]
name = "game"
harness = false

[[bench]]
name = "rollback"
harness = false

[lints]
workspace = true
