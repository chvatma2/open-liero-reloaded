[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.99"
publish = false

[workspace.dependencies]
rl-math = { path = "crates/rl-math" }
rl-data = { path = "crates/rl-data" }
rl-terrain = { path = "crates/rl-terrain" }
rl-sim = { path = "crates/rl-sim" }
rl-scenario = { path = "crates/rl-scenario" }
rl-content = { path = "crates/rl-content" }
rl-scene = { path = "crates/rl-scene" }
rl-fx = { path = "crates/rl-fx" }
rl-render = { path = "crates/rl-render" }
rl-present = { path = "crates/rl-present" }
rl-audio = { path = "crates/rl-audio" }
rl-input = { path = "crates/rl-input" }
rl-vfs = { path = "crates/rl-vfs" }
rl-pack = { path = "crates/rl-pack" }
rl-import-lgs = { path = "crates/rl-import-lgs" }
rl-import-lxl = { path = "crates/rl-import-lxl" }
rl-import-gfx = { path = "crates/rl-import-gfx" }
rl-oracle = { path = "crates/rl-oracle" }
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
ron = "0.12.2"
libm = "0.2.16"
serde_json = "1.0.151"
png = "0.18.1"
flate2 = "1.1.10"
sha2 = "0.11.0"
hex = "0.4.3"
thiserror = "2.0.21"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
cargo_metadata = "0.23.1"
syn = { version = "2.0.105", features = ["full"] }
prettyplease = "0.2.37"
quote = "1"
proptest = "1.11.0"
insta = "1.49.0"
tempfile = "3"
allocation-counter = "0.8.1"
# Graphics (plan 5): exact pins, in lockstep with egui-wgpu 0.36.2.
wgpu = "=30.0.1"
bytemuck = "=1.25.2"
pollster = "=1.0.1"
# Audio and input (plan 5): exact pins. winit matches egui-winit 0.36.2's.
kira = { version = "=0.12.5", default-features = false, features = ["cpal", "ogg", "vorbis", "wav", "pcm"] }
gilrs = { version = "=0.11.2", features = ["serde-serialize"] }
winit = { version = "=0.30.13", features = ["serde"] }
# The overlay (plan 5, spec §19 E10): exact pins, matching wgpu 30.0.1 and winit 0.30.13.
egui = "=0.36.2"
egui-wgpu = { version = "=0.36.2", default-features = false }
egui-winit = { version = "=0.36.2", default-features = false, features = ["wayland", "x11"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
