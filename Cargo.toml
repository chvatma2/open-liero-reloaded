[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.99"
publish = false

[workspace.dependencies]
olr-math = { path = "crates/olr-math" }
olr-data = { path = "crates/olr-data" }
olr-terrain = { path = "crates/olr-terrain" }
olr-look = { path = "crates/olr-look" }
olr-sim = { path = "crates/olr-sim" }
olr-modes = { path = "crates/olr-modes" }
olr-bots = { path = "crates/olr-bots" }
olr-replay = { path = "crates/olr-replay" }
olr-proto = { path = "crates/olr-proto" }
olr-netcode = { path = "crates/olr-netcode" }
olr-lobby = { path = "crates/olr-lobby" }
olr-scenario = { path = "crates/olr-scenario" }
olr-content = { path = "crates/olr-content" }
olr-scene = { path = "crates/olr-scene" }
olr-fx = { path = "crates/olr-fx" }
olr-render = { path = "crates/olr-render" }
olr-present = { path = "crates/olr-present" }
olr-audio = { path = "crates/olr-audio" }
olr-input = { path = "crates/olr-input" }
olr-vfs = { path = "crates/olr-vfs" }
olr-pack = { path = "crates/olr-pack" }
olr-format = { path = "crates/olr-format" }
olr-import = { path = "crates/olr-import" }
olr-edit = { path = "crates/olr-edit" }
olr-editor = { path = "crates/olr-editor" }
olr-import-lgs = { path = "crates/olr-import-lgs" }
olr-import-lxl = { path = "crates/olr-import-lxl" }
olr-import-gfx = { path = "crates/olr-import-gfx" }
olr-oracle = { path = "crates/olr-oracle" }
olr-ui = { path = "crates/olr-ui" }
olr-detcheck = { path = "crates/olr-detcheck" }
olr-net = { path = "crates/olr-net" }
olr-discovery = { path = "crates/olr-discovery" }
olr-online = { path = "crates/olr-online" }
olr-server = { path = "crates/olr-server" }
olr-log = { path = "crates/olr-log" }
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
ron = "0.12.2"
# Replays (plan 6): exact pins, the encoding is the replay format.
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
bech32 = { version = "=0.12.0", default-features = false, features = ["alloc"] }
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }
libm = "0.2.16"
serde_json = "1.0.151"
# Exact: encoded PNG bytes are content (hashes).
png = "=0.18.1"
# JPEG originals for level composition (plan 14a): exact pins, already
# locked through another dependency. Default features off: they turn on
# zune's AVX2/NEON paths. Another crate's `image` (olr-game) enables them
# anyway by feature unification; their output measured bit-identical to the
# scalar decode (docs/porting/STATUS.md, "Level composition decisions").
zune-jpeg = { version = "=0.5.15", default-features = false, features = ["std"] }
zune-core = "=0.5.3"
flate2 = "1.1.10"
sha2 = "0.11.0"
hex = "0.4.3"
thiserror = "2.0.21"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
cargo_metadata = "0.23.1"
syn = { version = "2.0.105", features = ["full"] }
prettyplease = "0.2.37"
quote = "1"
proc-macro2 = "1"
proptest = "1.11.0"
insta = "1.49.0"
tempfile = "3"
perf-event2 = "0.7.4"
allocation-counter = "0.8.1"
# Benchmarks (plan 7 G8): an exact pin, dev-dependency only.
divan = "=0.1.21"
# Graphics (plan 5): exact pins, in lockstep with egui-wgpu 0.36.2.
wgpu = "=30.0.1"
bytemuck = "=1.25.2"
pollster = "=1.0.1"
# Audio and input (plan 5): exact pins. winit matches egui-winit 0.36.2's.
kira = { version = "=0.12.5", default-features = false, features = ["cpal", "ogg", "vorbis", "wav", "pcm"] }
gilrs = { version = "=0.11.2", features = ["serde-serialize"] }
winit = { version = "=0.30.13", features = ["serde"] }
# The overlay (plan 5, spec §19 E10): exact pins, matching wgpu 30.0.1 and winit 0.30.13.
egui = "=0.36.2"
egui-wgpu = { version = "=0.36.2", default-features = false }
egui-winit = { version = "=0.36.2", default-features = false, features = ["clipboard", "wayland", "x11"] }
# Menus (plan 7): exact pins. egui_kittest drives GUI flows by label, in lockstep with egui.
egui_kittest = "=0.36.2"
directories = "=6.0.0"
# Online play (plan 10, decision N15): an exact pin, the rust-crypto backend.
# Needs no system C libraries, but dimpl's `rcgen` builds aws-lc-sys from C
# source (cc/cmake); the mingw cross-build handles it (ruling T1-C).
str0m = { version = "=0.24.0", default-features = false, features = ["rust-crypto"] }
# Signalling over a WebSocket (plan 10, spec §5.1): no TLS. olr-discovery's
# relay pool turns on its rustls feature for `wss://` (plan 12a).
tungstenite = "=0.30.0"
# TLS for Nostr relays (plan 12a): rustls 0.23.45 (2026-09-14) with its default
# aws-lc-rs provider, and Mozilla's roots from webpki-roots 1.0.9 (2026-07-18),
# never the platform's, so every OS trusts the same roots.
rustls = "=0.23.45"
webpki-roots = "=1.0.9"
# OS randomness for the native peers (plan 10).
getrandom = "=0.4.3"
# The dedicated server stops cleanly on Ctrl+C, SIGTERM and a closed
# console (plan 10 ruling T13-A): an exact pin.
ctrlc = { version = "=3.5.2", features = ["termination"] }
# The release zips (`cargo xtask dist`, xtask only): zip 8.6.0 (2026-04-25),
# deflate through flate2's pure-Rust backend; no bzip2, zstd or lzma.
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }
# TURN relays (plan 12b, decision N52): the sans-IO client, pure Rust, an
# exact pin (2026-08-05); default features keep `std`. Cargo.lock pins its
# stun-proto, stun-types and turn-types back (olr-net's CLAUDE.md). The relay
# server is our own (ruling TR-2): long-term credentials need MD5, HMAC-SHA1
# and CRC-32 (FINGERPRINT); hmac 0.13.0 (2026-03-29) is also NIP-44's.
turn-client-proto = "=0.7.2"
hmac = "=0.13.0"
sha1 = "=0.11.0"
md-5 = "=0.11.0"
crc32fast = "=1.5.2"
# The default interface's addresses and gateway (plan 12b, N48, N51): an
# exact pin; only `gateway` (`get_default_interface`, `Interface::gateway`),
# not the Apple and Android extras.
netdev = { version = "=0.46.3", default-features = false, features = ["gateway"] }
# Identity keys (plan 10, spec §5.2): BIP-340 Schnorr over secp256k1, no_std;
# `ecdh` for NIP-44's conversation keys (plan 12b, N44).
k256 = { version = "=0.14.0", default-features = false, features = ["schnorr", "ecdh"] }
# NIP-44 v2 (plan 12b, N44): HKDF-SHA256, ChaCha20 (IETF) and base64 with
# padding; exact pins, pure Rust (HMAC-SHA256 is the `hmac` pin above).
hkdf = "=0.13.0"
chacha20 = { version = "=0.10.2", default-features = false, features = ["cipher"] }
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
# The game's run log (issue #2): the `log` facade (already locked through
# wgpu and winit), and `time` for the local UTC offset alone (already locked
# through rcgen; `local-offset` adds num_threads on Unix).
log = { version = "=0.4.34", features = ["std"] }
time = { version = "=0.3.55", features = ["local-offset"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 1
debug = "line-tables-only"

# Dependencies without debug info: every test binary links wgpu, winit and
# egui, and their line tables alone kept `target/` growing by gigabytes.
# Our crates keep line tables, so panics in our code still show file:line.
[profile.dev.package."*"]
opt-level = 3
debug = false

# Whole-program optimisation for the shipped game and the measurements
# (`bench` inherits it). Panics stay unwinding: the game, audio, import
# and the CLI runner catch them to survive bad content.
[profile.release]
lto = "fat"
codegen-units = 1

# The release zips (`cargo xtask dist`): the release build without symbols
# or debug info. Panics stay unwinding, as in release.
[profile.dist]
inherits = "release"
strip = true
debug = false
