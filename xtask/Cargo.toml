[package]
name = "xtask"
description = "Developer workflows: cargo xtask check | layers | api | fetch-olx-content | oracle-record | oracle-gen-weapons | bless-render | install-hooks | dist | publish."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
cargo_metadata.workspace = true
serde = { workspace = true, features = ["std"] }
ron.workspace = true
syn.workspace = true
prettyplease.workspace = true
quote.workspace = true
proc-macro2.workspace = true
olr-oracle.workspace = true
olr-data.workspace = true
olr-pack.workspace = true
olr-vfs.workspace = true
sha2.workspace = true
hex.workspace = true
# `dist`: writes and unpacks the release zips (deflate by flate2's default
# pure-Rust backend, which olr-pack's png and olr-oracle turn on).
zip.workspace = true
tempfile.workspace = true
# `net-nat`: Ctrl+C removes its containers and networks before exiting.
ctrlc.workspace = true
# `dist` and `publish` (issue #4): release names, the install manifest,
# the Windows zip's signed manifest; the Flatpak key's fingerprint
# (OpenPGP v4: SHA-1) from its armor (base64).
olr-update.workspace = true
sha1.workspace = true
base64.workspace = true

[lints]
workspace = true
